spring.application.name=food-waste
server.port=${PORT:8081}

# Database Configuration
# In Render or Cloud, DATABASE_URL is automatically detected.
# In local development, you can override with SPRING_DATASOURCE_URL or use local PostgreSQL / H2 fallback.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/food_waste_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# CORS Configuration
# Allow all origins by default so Vercel frontend connects seamlessly
app.cors.allowed-origins=*

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
